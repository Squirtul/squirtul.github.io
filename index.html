<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On Frequency Badge</title>
<style>
  :root {
    --ink: #e7ece9;
    --dim: #8a9b92;
    --line: #2a3733;
    --panel: #101613;
    --live: #7fd9a8;
    --off: #55605c;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #freq-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--ink);
    max-width: fit-content;
    line-height: 1.25;
  }
  #freq-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--off);
    flex-shrink: 0;
  }
  #freq-badge.live .dot {
    background: var(--live);
  }
  #freq-badge .text {
    display: flex;
    flex-direction: column;
  }
  #freq-badge .status {
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--dim);
  }
  #freq-badge .pos {
    font-size: 14px;
    font-weight: 600;
  }
  #freq-badge .freq {
    font-variant-numeric: tabular-nums;
    color: var(--dim);
    font-size: 13px;
    margin-left: 2px;
  }
</style>
</head>
<body>

<div id="freq-badge">
  <span class="dot"></span>
  <span class="text">
    <span class="status" id="freq-status">checking…</span>
    <span class="pos" id="freq-position"></span>
  </span>
</div>

<script>
(function () {
  var CID = "1778154";

  // code -> [display name, frequency]
  var POSITIONS = {
    "EBOS_APP":   ["Oostende Approach", "120.605"],
    "EBOS_TWR":   ["Oostende Tower", "118.180"],
    "EBOS_GND":   ["Oostende Ground", "121.980"],
    "EBKT_I_TWR": ["Kortrijk Information", "120.255"],
    "ELLX_APP":   ["Lëtzebuerg Radar", "120.885"],
    "ELLX_F_APP": ["Lëtzebuerg Arrival", "118.905"],
    "ELLX_TWR":   ["Lëtzebuerg Tower", "118.105"],
    "ELLX_DEL":   ["Lëtzebuerg Delivery", "121.855"],
    "EBBR_DEP":   ["Brussels Departure", "126.630"],
    "EBBR_APP":   ["Brussels Arrival", "118.255"],
    "EBBR_F_APP": ["Brussels Approach", "120.105"],
    "EBBR_TWR":   ["Brussels Tower", "118.605"],
    "EBBR_N_TWR": ["Brussels Tower", "120.780"],
    "EBBR_GND":   ["Brussels Ground", "118.055"],
    "EBBR_C_GND": ["Brussels Ground", "121.660"],
    "EBBR_S_GND": ["Brussels Ground", "121.880"],
    "EBBR_DEL":   ["Brussels Delivery", "121.955"],
    "EBCI_APP":   ["Charleroi Approach", "133.130"],
    "EBCI_TWR":   ["Charleroi Tower", "121.305"],
    "EBCI_GND":   ["Charleroi Ground", "121.805"]
  };

  var badge = document.getElementById("freq-badge");
  var statusEl = document.getElementById("freq-status");
  var posEl = document.getElementById("freq-position");

  function setOffline() {
    badge.classList.remove("live");
    statusEl.textContent = "not on frequency";
    posEl.textContent = "";
  }

  function setLive(callsign, freqFromFeed) {
    badge.classList.add("live");
    statusEl.textContent = "on frequency";
    var known = POSITIONS[callsign];
    if (known) {
      posEl.textContent = known[0] + "  ·  " + known[1];
    } else {
      // not in the manual table — fall back to raw callsign + feed frequency
      posEl.textContent = callsign + "  ·  " + freqFromFeed;
    }
  }

  function setError() {
    badge.classList.remove("live");
    statusEl.textContent = "status unavailable";
    posEl.textContent = "";
  }

  function poll() {
    fetch("https://data.vatsim.net/v3/vatsim-data.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var controllers = data.controllers || [];
        var mine = null;
        for (var i = 0; i < controllers.length; i++) {
          if (String(controllers[i].cid) === CID) {
            mine = controllers[i];
            break;
          }
        }
        if (mine) {
          setLive(mine.callsign, mine.frequency);
        } else {
          setOffline();
        }
      })
      .catch(function () {
        setError();
      });
  }

  poll();
  setInterval(poll, 300000); // refresh every 5 minutes
})();
</script>

</body>
</html>
